<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Great India Technology</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f5f7fb;color:#17203a}.top{background:#111936;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10}.wrap{max-width:1180px;margin:24px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e3e7ef;border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 5px 20px #17203a0a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{margin-bottom:14px}.field label{display:block;font-weight:750;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid #d6dae5;border-radius:10px;font:inherit}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:10px 15px;background:#4f46e5;color:#fff;font-weight:750;cursor:pointer}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#b42318}.success{background:#087443}.muted{color:#667085;font-size:13px}.card{border:1px solid #e3e7ef;border-radius:14px;padding:14px;background:#fff;min-width:0}.card img{width:64px;height:64px;object-fit:cover;border-radius:14px;border:1px solid #eee;background:#f8fafc}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.notice{background:#ecfdf3;border:1px solid #a7f3d0;color:#065f46;padding:12px 14px;border-radius:12px;margin-bottom:18px}.error{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;padding:12px 14px;border-radius:12px;margin-bottom:18px}.preview{width:80px;height:80px;border-radius:16px;object-fit:cover;border:1px solid #ddd;background:#f8fafc}#appsList{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}#appsList .card{max-width:340px;padding:12px;overflow:hidden}#appsList .card img{width:60px;height:60px;border-radius:13px;display:block;margin-bottom:8px}#appsList h3{margin:5px 0 4px;font-size:16px;line-height:1.3;word-break:break-word}#appsList p{margin:4px 0;font-size:12px;line-height:1.45;word-break:break-word}#appsList .actions{margin-top:9px;gap:6px}#appsList .actions button{padding:8px 11px;font-size:12px;border-radius:8px}
@media(max-width:800px){.grid,.items,#appsList{grid-template-columns:1fr}.top{position:static}#appsList .card{max-width:100%}}
@media(max-width:480px){.wrap{padding:0 12px}.panel{padding:16px;border-radius:15px}}
</style></head>
<body>
<div class="top"><b>Great India Technology — Admin Panel</b><button class="secondary" id="logout">Logout</button></div>
<div class="wrap"><h1>Admin Dashboard</h1><div id="status" class="notice">Connecting to Supabase…</div>

<section class="panel"><div class="row"><h2>⚙️ Company / Site Settings</h2><button class="success" id="saveSettings">💾 Save Settings</button></div>
<div class="grid"><div>
<div class="field"><label>Company Name</label><input id="companyName"></div>
<div class="field"><label>Tagline</label><input id="tagline"></div>
<div class="field"><label>Hero Heading</label><input id="heroHeading"></div>
<div class="field"><label>About Information</label><textarea id="aboutText"></textarea></div>
<div class="field"><label>Contact Email</label><input id="email" type="email"></div>
<div class="field"><label>Office Mobile</label><input id="mobile"></div>
</div><div>
<div class="field"><label>Office Address</label><textarea id="address"></textarea></div>
<div class="field"><label>Company Logo</label><input id="companyLogo" type="file" accept="image/*"></div>
<img id="logoPreview" class="preview" alt="Logo preview"><p class="muted">Images are uploaded to Supabase Storage. The database stores only the public URL.</p>
</div></div></section>

<section class="panel"><h2>🛠️ Services</h2><div class="grid"><div><div class="field"><label>Service Name</label><input id="serviceName"></div><div class="field"><label>Description</label><textarea id="serviceDesc"></textarea></div><button id="addService">➕ Add Service</button></div></div><div id="servicesList" class="items" style="margin-top:16px"></div></section>

<section class="panel"><h2>📱 Apps & Projects</h2><div class="grid"><div>
<div class="field"><label>Name</label><input id="appName"></div><div class="field"><label>Description</label><textarea id="appDesc"></textarea></div><div class="field"><label>App / Website Link</label><input id="appUrl" type="url" placeholder="https://example.com"></div>
</div><div><div class="field"><label>Logo</label><input id="appLogo" type="file" accept="image/*"></div><img id="appPreview" class="preview" alt="App preview"><div class="actions"><button id="saveApp">➕ Add App</button><button class="secondary" id="cancelApp" hidden>Cancel</button></div></div></div><div id="appsList" style="margin-top:18px"></div></section>

<section class="panel"><h2>👥 Team Members</h2><div class="grid"><div>
<div class="field"><label>Name</label><input id="memberName"></div><div class="field"><label>Designation / Role</label><input id="memberRole"></div><div class="field"><label>Information</label><textarea id="memberBio"></textarea></div>
</div><div><div class="field"><label>Photo</label><input id="memberPhoto" type="file" accept="image/*"></div><img id="memberPreview" class="preview" alt="Member preview"><div class="actions"><button id="saveMember">➕ Add Team Member</button><button class="secondary" id="cancelMember" hidden>Cancel</button></div></div></div><div id="teamList" class="items" style="margin-top:18px"></div></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script>
<script>
const fallback='assets/logo.svg', statusBox=document.getElementById('status');
const sb=(window.GIT_SUPABASE_URL&&window.GIT_SUPABASE_KEY)?supabase.createClient(window.GIT_SUPABASE_URL,window.GIT_SUPABASE_KEY):null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let settings={},services=[],apps=[],team=[],editApp=null,editMember=null;

async function requireAuth(){const {data}=await sb.auth.getSession();if(!data.session){location.href='admin.html';return false}return true}
async function uploadImage(file,folder){
  if(!file)return '';
  if(!file.type.startsWith('image/'))throw new Error('Please select an image file.');
  if(file.size>5*1024*1024)throw new Error('Image must be 5 MB or smaller.');
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=`${folder}/${crypto.randomUUID()}.${ext}`;
  const {error}=await sb.storage.from('site-assets').upload(path,file,{upsert:false,contentType:file.type});
  if(error)throw error;
  const {data}=sb.storage.from('site-assets').getPublicUrl(path);
  return data.publicUrl;
}
function preview(input,img){const f=input.files[0];if(!f){img.src='';return}img.src=URL.createObjectURL(f)}
companyLogo.onchange=()=>preview(companyLogo,logoPreview);appLogo.onchange=()=>preview(appLogo,appPreview);memberPhoto.onchange=()=>preview(memberPhoto,memberPreview);

async function load(){
  const [s,sv,a,t]=await Promise.all([
    sb.from('site_settings').select('*').eq('id',1).maybeSingle(),
    sb.from('services').select('*').order('sort_order'),
    sb.from('apps').select('*').order('created_at',{ascending:false}),
    sb.from('team_members').select('*').order('sort_order')
  ]);
  for(const r of [s,sv,a,t])if(r.error)throw r.error;
  settings=s.data||{};services=sv.data||[];apps=a.data||[];team=t.data||[];
  companyName.value=settings.company_name||'Great India Technology';tagline.value=settings.tagline||'';heroHeading.value=settings.hero_heading||'';aboutText.value=settings.description||'';email.value=settings.email||'';mobile.value=settings.phone||'';address.value=settings.address||'';logoPreview.src=settings.company_logo_url||fallback;
  render();
}
function render(){
  servicesList.innerHTML=services.map(x=>`<div class="card"><b>${esc(x.icon||'🚀')} ${esc(x.title)}</b><p class="muted">${esc(x.description)}</p><div class="actions"><button class="danger" onclick="removeService('${x.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No services yet.</p>';
  appsList.innerHTML=apps.map(x=>`<div class="card"><img src="${esc(x.logo_url||fallback)}" alt=""><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><p class="muted">${esc(x.url||'')}</p><div class="actions"><button onclick="startEditApp('${x.id}')">Edit</button><button class="danger" onclick="removeApp('${x.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No apps/projects yet.</p>';
  teamList.innerHTML=team.map(x=>`<div class="card"><img src="${esc(x.photo_url||fallback)}" alt=""><h3>${esc(x.name)}</h3><p>${esc(x.designation||'')}</p><p class="muted">${esc(x.bio||'')}</p><div class="actions"><button onclick="startEditMember('${x.id}')">Edit</button><button class="danger" onclick="removeMember('${x.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No team members yet.</p>';
}
async function saveSiteSettings(){
  const patch={id:1,company_name:companyName.value.trim(),tagline:tagline.value.trim(),hero_heading:heroHeading.value.trim(),description:aboutText.value.trim(),email:email.value.trim(),phone:mobile.value.trim(),address:address.value.trim()};
  if(companyLogo.files[0])patch.company_logo_url=await uploadImage(companyLogo.files[0],'company');
  const {error}=await sb.from('site_settings').upsert(patch,{onConflict:'id'});if(error)throw error;settings={...settings,...patch};logoPreview.src=patch.company_logo_url||settings.company_logo_url||fallback;
}
addService.onclick=async()=>{try{const title=serviceName.value.trim(),description=serviceDesc.value.trim();if(!title)throw new Error('Service name is required.');const {error}=await sb.from('services').insert({title,description,icon:'🚀',sort_order:services.length,is_active:true});if(error)throw error;serviceName.value='';serviceDesc.value='';await load();toast('Service added.')}catch(e){toast(e.message,true)}};
async function removeService(id){if(!confirm('Delete this service?'))return;const {error}=await sb.from('services').delete().eq('id',id);if(error)toast(error.message,true);else load()}
saveApp.onclick=async()=>{try{const name=appName.value.trim();if(!name)throw new Error('App name is required.');const patch={name,description:appDesc.value.trim(),url:appUrl.value.trim(),is_active:true};if(appLogo.files[0])patch.logo_url=await uploadImage(appLogo.files[0],'apps');let q;if(editApp){q=sb.from('apps').update(patch).eq('id',editApp)}else{q=sb.from('apps').insert(patch)}const {error}=await q;if(error)throw error;resetApp();await load();toast(editApp?'App updated.':'App added.')}catch(e){toast(e.message,true)}};
function startEditApp(id){const x=apps.find(a=>a.id===id);if(!x)return;editApp=id;appName.value=x.name||'';appDesc.value=x.description||'';appUrl.value=x.url||'';appPreview.src=x.logo_url||fallback;saveApp.textContent='💾 Update App';cancelApp.hidden=false}
cancelApp.onclick=resetApp;function resetApp(){editApp=null;appName.value='';appDesc.value='';appUrl.value='';appLogo.value='';appPreview.src='';saveApp.textContent='➕ Add App';cancelApp.hidden=true}
async function removeApp(id){if(!confirm('Delete this app/project?'))return;const {error}=await sb.from('apps').delete().eq('id',id);if(error)toast(error.message,true);else load()}
saveMember.onclick=async()=>{try{const name=memberName.value.trim();if(!name)throw new Error('Member name is required.');const patch={name,designation:memberRole.value.trim(),bio:memberBio.value.trim(),is_active:true};if(memberPhoto.files[0])patch.photo_url=await uploadImage(memberPhoto.files[0],'team');let q=editMember?sb.from('team_members').update(patch).eq('id',editMember):sb.from('team_members').insert({...patch,sort_order:team.length});const {error}=await q;if(error)throw error;resetMember();await load();toast(editMember?'Team member updated.':'Team member added.')}catch(e){toast(e.message,true)}};
function startEditMember(id){const x=team.find(a=>a.id===id);if(!x)return;editMember=id;memberName.value=x.name||'';memberRole.value=x.designation||'';memberBio.value=x.bio||'';memberPreview.src=x.photo_url||fallback;saveMember.textContent='💾 Update Team Member';cancelMember.hidden=false}
cancelMember.onclick=resetMember;function resetMember(){editMember=null;memberName.value='';memberRole.value='';memberBio.value='';memberPhoto.value='';memberPreview.src='';saveMember.textContent='➕ Add Team Member';cancelMember.hidden=true}
async function removeMember(id){if(!confirm('Delete this team member?'))return;const {error}=await sb.from('team_members').delete().eq('id',id);if(error)toast(error.message,true);else load()}
function toast(text,error=false){statusBox.className=error?'error':'notice';statusBox.textContent=text;setTimeout(()=>{statusBox.className='notice';statusBox.textContent='Ready.'},3500)}
saveSettings.onclick=async()=>{try{saveSettings.disabled=true;await saveSiteSettings();toast('Site settings saved.')}catch(e){toast(e.message,true)}finally{saveSettings.disabled=false}}
logout.onclick=async()=>{await sb.auth.signOut();location.href='admin.html'};
(async()=>{try{if(!sb)throw new Error('Supabase configuration is missing.');if(!(await requireAuth()))return;await load();toast('Connected. Dashboard is ready.')}catch(e){statusBox.className='error';statusBox.textContent=e.message}})();
</script></body></html>
