<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Great India Technology</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f5f7fb;color:#17203a}.top{background:#111936;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10}.wrap{max-width:1180px;margin:24px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e3e7ef;border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 5px 20px #17203a0a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{margin-bottom:14px}.field label{display:block;font-weight:750;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #d6dae5;border-radius:10px;font:inherit}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:10px 15px;background:#4f46e5;color:#fff;font-weight:750;cursor:pointer}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#b42318}.success{background:#087443}.muted{color:#667085;font-size:14px}.card{border:1px solid #e3e7ef;border-radius:14px;padding:14px}.card img{width:76px;height:76px;object-fit:cover;border-radius:16px;border:1px solid #eee;background:#f8fafc}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.notice{background:#ecfdf3;border:1px solid #a7f3d0;color:#065f46;padding:12px 14px;border-radius:12px;margin-bottom:18px}.error{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;padding:12px 14px;border-radius:12px;margin-bottom:18px}.preview{max-width:110px;max-height:110px;border-radius:18px;object-fit:cover;border:1px solid #ddd}@media(max-width:800px){.grid,.items{grid-template-columns:1fr}.top{position:static}}.card img{width:56px;height:56px;object-fit:cover;border-radius:14px;background:#fff;border:1px solid #eef0f4} .preview{max-width:72px!important;max-height:72px!important;object-fit:cover;border-radius:14px} </style></head><body><div class="top"><b>Great India Technology — Admin Panel</b><button class="secondary" id="logout">Logout</button></div><div class="wrap"><h1>Admin Dashboard</h1><div id="status" class="notice">Connecting to Supabase…</div>
<section class="panel"><div class="row"><h2>⚙️ Company / Site Settings</h2><button class="success" id="saveSettings">💾 Save Settings</button></div><div class="grid"><div><div class="field"><label>Company Name</label><input id="companyName"></div><div class="field"><label>Tagline</label><input id="tagline"></div><div class="field"><label>Hero Heading</label><input id="heroHeading"></div><div class="field"><label>About Information</label><textarea id="aboutText"></textarea></div><div class="field"><label>Contact Email</label><input id="email" type="email"></div><div class="field"><label>Office Mobile</label><input id="mobile"></div></div><div><div class="field"><label>Office Address</label><textarea id="address"></textarea></div><div class="field"><label>Company Logo</label><input id="companyLogo" type="file" accept="image/*"></div><img id="logoPreview" class="preview"><p class="muted">Images are stored as data URLs in Supabase. For very large images, resize before uploading.</p></div></div></section>
<section class="panel"><h2>🛠️ Services</h2><div class="grid"><div><div class="field"><label>Service Name</label><input id="serviceName"></div><div class="field"><label>Description</label><textarea id="serviceDesc"></textarea></div><button id="addService">➕ Add Service</button></div></div><div id="servicesList" class="items" style="margin-top:16px"></div></section>
<section class="panel"><h2>📱 Apps & Projects</h2><div class="grid"><div><div class="field"><label>Name</label><input id="appName" placeholder="e.g. BizNest"></div><div class="field"><label>Category</label><input id="appCategory" placeholder="Business / Education / Project"></div><div class="field"><label>Description</label><textarea id="appDesc" placeholder="Short description"></textarea></div><div class="field"><label>App / Project URL</label><input id="appUrl" type="url" placeholder="https://..."></div><div class="field"><label>Website URL (optional)</label><input id="appWebsiteUrl" type="url" placeholder="https://..."></div></div><div><div class="field"><label>App / Project Logo</label><input id="appLogo" type="file" accept="image/*"></div><img id="appPreview" class="preview"><div class="actions"><button id="saveApp">➕ Add App / Project</button><button class="secondary" id="cancelApp" hidden>Cancel</button></div></div></div><div id="appsList" class="items" style="margin-top:18px"></div></section>
<section class="panel"><h2>👥 Team Members</h2><div class="grid"><div><div class="field"><label>Name</label><input id="memberName"></div><div class="field"><label>Designation / Role</label><input id="memberRole"></div><div class="field"><label>Information</label><textarea id="memberBio"></textarea></div></div><div><div class="field"><label>Photo</label><input id="memberPhoto" type="file" accept="image/*"></div><img id="memberPreview" class="preview"><div class="actions"><button id="saveMember">➕ Add Team Member</button><button class="secondary" id="cancelMember" hidden>Cancel</button></div></div></div><div id="teamList" class="items" style="margin-top:18px"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script>
const fallbackLogo='assets/logo.jpg', statusBox=document.getElementById('status');
if(!window.GIT_SUPABASE_KEY||window.GIT_SUPABASE_KEY.includes('PASTE_')){statusBox.className='error';statusBox.textContent='Supabase Publishable Key missing. Edit assets/supabase-config.js.';throw new Error('Supabase key missing')}
const sb=supabase.createClient(window.GIT_SUPABASE_URL,window.GIT_SUPABASE_KEY);let settings={},services=[],apps=[],team=[],editApp=null,editMember=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const readFile=input=>new Promise(resolve=>{const f=input.files[0];if(!f)return resolve('');const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)});
async function requireAuth(){const {data}=await sb.auth.getSession();if(!data.session){location.href='admin.html';return false}return true}
async function load(){const [s,sv,a,t]=await Promise.all([sb.from('site_settings').select('*').order('updated_at',{ascending:false}).limit(1).maybeSingle(),sb.from('services').select('*').eq('is_active',true).order('sort_order'),sb.from('apps').select('*').eq('is_active',true).order('sort_order'),sb.from('team_members').select('*').eq('is_active',true).order('sort_order')]);for(const x of [s,sv,a,t])if(x.error)throw x.error;settings=s.data||{};services=sv.data||[];apps=a.data||[];team=t.data||[];fill();statusBox.className='notice';statusBox.textContent='Connected. Changes saved here are stored in Supabase and can be shown on every device.'}
function fill(){for(const id of ['companyName','tagline','heroHeading','aboutText','email','mobile','address'])document.getElementById(id).value=settings[id]||'';document.getElementById('logoPreview').src=settings.logo_url||fallbackLogo;render()}
function render(){document.getElementById('servicesList').innerHTML=services.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><div class="actions"><button onclick="editService('${x.id}')">Edit</button><button class="danger" onclick="del('services','${x.id}')">Delete</button></div></div>`).join('');document.getElementById('appsList').innerHTML=apps.map(x=>`<div class="card"><img src="${esc(x.logo_url||fallbackLogo)}"><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><p class="muted">${esc(x.app_url)}</p><div class="actions"><button onclick="startApp('${x.id}')">Edit</button><button class="danger" onclick="del('apps','${x.id}')">Delete</button></div></div>`).join('');document.getElementById('teamList').innerHTML=team.map(x=>`<div class="card"><img src="${esc(x.photo_url||fallbackLogo)}"><h3>${esc(x.name)}</h3><b>${esc(x.designation)}</b><p>${esc(x.bio)}</p><div class="actions"><button onclick="startMember('${x.id}')">Edit</button><button class="danger" onclick="del('team_members','${x.id}')">Delete</button></div></div>`).join('')}
async function saveSettings(){const logo=await readFile(document.getElementById('companyLogo'));const row={company_name:document.getElementById('companyName').value.trim()||'Great India Technology',tagline:document.getElementById('tagline').value.trim(),description:document.getElementById('aboutText').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('mobile').value.trim(),whatsapp:document.getElementById('mobile').value.trim(),address:document.getElementById('address').value.trim()};if(logo)row.logo_url=logo;if(settings.id){const {error}=await sb.from('site_settings').update(row).eq('id',settings.id);if(error)return alert(error.message)}else{const {data,error}=await sb.from('site_settings').insert(row).select().single();if(error)return alert(error.message);settings=data}await load();alert('Settings saved globally.')}
async function addService(){const title=document.getElementById('serviceName').value.trim();if(!title)return alert('Enter service name');const {error}=await sb.from('services').insert({title,description:document.getElementById('serviceDesc').value.trim(),sort_order:services.length});if(error)return alert(error.message);document.getElementById('serviceName').value='';document.getElementById('serviceDesc').value='';await load()}
window.editService=async id=>{const x=services.find(v=>v.id===id);if(!x)return;const title=prompt('Service name',x.title);if(title===null)return;const description=prompt('Description',x.description||'');if(description===null)return;const {error}=await sb.from('services').update({title,description}).eq('id',id);if(error)return alert(error.message);load()};
window.del=async(table,id)=>{if(!confirm('Delete this item?'))return;const {error}=await sb.from(table).update({is_active:false}).eq('id',id);if(error)return alert(error.message);load()};
window.startApp=id=>{editApp=apps.find(v=>v.id===id)||null;document.getElementById('appName').value=editApp?.name||'';document.getElementById('appCategory').value=editApp?.category||'';document.getElementById('appDesc').value=editApp?.description||'';document.getElementById('appUrl').value=editApp?.app_url||'';document.getElementById('appWebsiteUrl').value=editApp?.website_url||'';document.getElementById('appPreview').src=editApp?.logo_url||fallbackLogo;document.getElementById('saveApp').textContent='💾 Update App';document.getElementById('cancelApp').hidden=false};
document.getElementById('cancelApp').onclick=()=>{editApp=null;document.getElementById('appName').value='';document.getElementById('appCategory').value='';document.getElementById('appDesc').value='';document.getElementById('appUrl').value='';document.getElementById('appWebsiteUrl').value='';document.getElementById('appPreview').src='';document.getElementById('saveApp').textContent='➕ Add App';document.getElementById('cancelApp').hidden=true};
document.getElementById('saveApp').onclick=async()=>{const name=document.getElementById('appName').value.trim();if(!name)return alert('Enter app name');const logo=await readFile(document.getElementById('appLogo'));const row={name,category:document.getElementById('appCategory').value.trim(),description:document.getElementById('appDesc').value.trim(),app_url:document.getElementById('appUrl').value.trim(),website_url:document.getElementById('appWebsiteUrl').value.trim(),sort_order:apps.length};if(logo)row.logo_url=logo;let q=editApp?sb.from('apps').update(row).eq('id',editApp.id):sb.from('apps').insert(row);const {error}=await q;if(error)return alert(error.message);document.getElementById('cancelApp').click();await load()};
window.startMember=id=>{editMember=team.find(v=>v.id===id)||null;document.getElementById('memberName').value=editMember?.name||'';document.getElementById('memberRole').value=editMember?.designation||'';document.getElementById('memberBio').value=editMember?.bio||'';document.getElementById('memberPreview').src=editMember?.photo_url||fallbackLogo;document.getElementById('saveMember').textContent='💾 Update Team Member';document.getElementById('cancelMember').hidden=false};
document.getElementById('cancelMember').onclick=()=>{editMember=null;for(const id of ['memberName','memberRole','memberBio'])document.getElementById(id).value='';document.getElementById('memberPreview').src='';document.getElementById('saveMember').textContent='➕ Add Team Member';document.getElementById('cancelMember').hidden=true};
document.getElementById('saveMember').onclick=async()=>{const name=document.getElementById('memberName').value.trim();if(!name)return alert('Enter name');const photo=await readFile(document.getElementById('memberPhoto'));const row={name,designation:document.getElementById('memberRole').value.trim(),bio:document.getElementById('memberBio').value.trim(),sort_order:team.length};if(photo)row.photo_url=photo;let q=editMember?sb.from('team_members').update(row).eq('id',editMember.id):sb.from('team_members').insert(row);const {error}=await q;if(error)return alert(error.message);document.getElementById('cancelMember').click();await load()};
document.getElementById('companyLogo').onchange=async e=>{const x=await readFile(e.target);if(x)document.getElementById('logoPreview').src=x};document.getElementById('appLogo').onchange=async e=>{const x=await readFile(e.target);if(x)document.getElementById('appPreview').src=x};document.getElementById('memberPhoto').onchange=async e=>{const x=await readFile(e.target);if(x)document.getElementById('memberPreview').src=x};document.getElementById('saveSettings').onclick=saveSettings;document.getElementById('addService').onclick=addService;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin.html'};
(async()=>{if(await requireAuth())try{await load()}catch(e){statusBox.className='error';statusBox.textContent=e.message}})();
</script></body></html>
