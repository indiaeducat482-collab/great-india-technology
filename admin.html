<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Great India Technology</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#eef2ff,#faf5ff);min-height:100vh;display:grid;place-items:center;color:#17203a}.box{width:min(440px,92%);background:#fff;border:1px solid #e6e8f0;border-radius:24px;padding:30px;box-shadow:0 25px 70px #1e293b18}.logo{width:70px;height:70px;border-radius:18px}h1{margin:18px 0 6px}.muted{color:#667085}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #d8dce7;border-radius:11px;font-size:15px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:11px;background:#4f46e5;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.back{display:block;text-align:center;margin-top:18px;color:#4f46e5;font-weight:700}.hint{font-size:12px;color:#98a2b3;margin-top:16px;line-height:1.5}.error{color:#b42318;margin-top:12px;font-weight:700}</style></head>
<body><div class="box"><img class="logo" src="assets/logo.svg"><h1>Admin Login</h1><div class="muted">Great India Technology</div>
<form id="login"><label>Admin Email</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button>Login to Admin Panel</button><div id="msg"></div></form>
<div class="hint">Uses Supabase Auth. Create the admin user in Supabase Dashboard → Authentication → Users. Never put a service_role/secret key in this project.</div><a class="back" href="index.html">← Back to Website</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script>
const msg=document.getElementById('msg');
const configured=window.GIT_SUPABASE_URL&&window.GIT_SUPABASE_KEY&&!window.GIT_SUPABASE_KEY.includes('PASTE_');
const sb=configured?supabase.createClient(window.GIT_SUPABASE_URL,window.GIT_SUPABASE_KEY):null;
if(!sb){msg.className='error';msg.textContent='Supabase configuration is missing.'}
document.getElementById('login').onsubmit=async e=>{e.preventDefault();if(!sb)return;msg.className='';msg.textContent='Signing in...';
const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.className='error';msg.textContent=error.message;return}location.href='admin-dashboard.html'};
</script></body></html>
