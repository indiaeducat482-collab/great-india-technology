<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Great India Technology</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#eef2ff,#faf5ff);min-height:100vh;display:grid;place-items:center;color:#17203a}.box{width:min(430px,92%);background:white;border:1px solid #e6e8f0;border-radius:24px;padding:30px;box-shadow:0 25px 70px #1e293b18}.logo{width:65px;height:65px;border-radius:18px;object-fit:cover}h1{margin:18px 0 6px}.muted{color:#667085}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #d8dce7;border-radius:11px;font-size:15px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:11px;background:#4f46e5;color:white;font-weight:800;font-size:15px;cursor:pointer}.back{display:block;text-align:center;margin-top:18px;color:#4f46e5;font-weight:700}.hint{font-size:12px;color:#98a2b3;margin-top:16px}.error{color:#b42318;margin-top:12px;font-weight:700}
</style></head><body><div class="box"><img class="logo" src="assets/logo.jpg"><h1>Admin Login</h1><div class="muted">Great India Technology</div>
<form id="login"><label>Admin ID</label><input id="u" autocomplete="username" required><label>Password</label><input id="p" type="password" autocomplete="current-password" required><button>Login to Admin Panel</button><div id="e" class="error"></div></form>
<div class="hint">Demo frontend login. For production, connect this panel to Supabase Auth or another secure server-side authentication system.</div><a class="back" href="index.html">← Back to Website</a></div>
<script>
document.getElementById('login').onsubmit=e=>{e.preventDefault();let u=document.getElementById('u').value,p=document.getElementById('p').value;
if(u==='admin'&&p==='GreatIndia@2026'){sessionStorage.setItem('git_admin','1');location.href='admin-dashboard.html'}else document.getElementById('e').textContent='Invalid Admin ID or Password';};
</script></body></html>
